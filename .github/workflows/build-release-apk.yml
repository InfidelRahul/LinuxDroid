name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Compile release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass linuxdroid \
            -keypass linuxdroid \
            -alias linuxdroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=LinuxDroid CI,O=LinuxDroid"

      - name: Compile release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Generate APK checksum
        run: |
          sha256sum app/build/outputs/apk/release/*.apk \
            > app/build/outputs/apk/release/SHA256SUMS

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: linuxdroid-release-apk
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
