name: Build release APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Compile release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      # Meson/Ninja are required to cross-build libweston and its deps
      # (bootstrap-deps.sh + build-libweston.sh). pkg-config is needed by Meson.
      - name: Install Meson / Ninja / pkg-config
        run: |
          python3 -m pip install --break-system-packages --quiet meson ninja pkgconfig 2>/dev/null \
            || python3 -m pip install --user --quiet meson ninja pkgconfig
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          # libexpat1-dev is needed to build the HOST wayland-scanner
          # (bootstrap-deps.sh builds it natively before cross-building wayland).
          sudo apt-get update && sudo apt-get install -y pkg-config curl libexpat1-dev

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # Weston: fetch + verify + build the real libweston for ARM64.
      # Weston is tracked from the InfidelRahul/weston development mirror main;
      # the resolved commit is recorded/verified per build (no fixed SHA pin).
      # ------------------------------------------------------------------

      - name: Fetch Weston from InfidelRahul/weston mirror main
        run: native/weston/fetch-weston.sh

      - name: Verify resolved mirror-main Weston revision
        run: native/weston/verify-weston.sh --strict-source

      - name: Bootstrap libweston cross dependencies (arm64-v8a / API 36)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          DEP_SYSROOT: ${{ github.workspace }}/native/weston/deps/sysroot
        run: |
          set -o pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p native/weston/deps
          # Tee the full bootstrap output to an artifact; show only the last 120
          # lines in the step log so the failing sub-build's error is not
          # truncated away.
          native/weston/bootstrap-deps.sh 2>&1 | tee native/weston/deps/bootstrap-log.txt | tail -120
          exit "${PIPESTATUS[0]}"

      - name: Verify tracked InfidelRahul dependency commits (after bootstrap)
        env:
          DEP_SYSROOT: ${{ github.workspace }}/native/weston/deps/sysroot
        run: native/weston/verify-weston.sh --strict-source --strict-deps

      - name: Upload bootstrap diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-log.txt
          if-no-files-found: warn
          retention-days: 7
          path: native/weston/deps/bootstrap-log.txt

      - name: Build libweston for arm64-v8a / API 36+ (mirror main)
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/29.0.14206865
          DEP_SYSROOT: ${{ github.workspace }}/native/weston/deps/sysroot
          DEP_PKG_CONFIG_PATH: ${{ github.workspace }}/native/weston/deps/sysroot/lib/pkgconfig:${{ github.workspace }}/native/weston/deps/sysroot/share/pkgconfig
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          native/weston/build-libweston.sh

      # ------------------------------------------------------------------
      # The ephemeral CI signing key (temporary; not for production).
      # ------------------------------------------------------------------
      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass linuxdroid \
            -keypass linuxdroid \
            -alias linuxdroid \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=LinuxDroid CI,O=LinuxDroid"

      - name: Verify resolved Weston source (Gradle task)
        run: ./gradlew verifyWeston --no-daemon

      - name: Verify real libweston install (Phase 3 gate)
        run: ./gradlew verifyWestonBuild --no-daemon

      - name: Compile release APK (real libweston path required)
        shell: bash
        run: |
          # -PreqWeston gates the native CMake to FAIL if the real libweston
          # path (LINUXDROID_HAS_LIBWESTON) is not active, so a fallback-only
          # Phase 3 build cannot pass CI.
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -PreqWeston 2>&1 | tee build-log.txt

      - name: Confirm real libweston path was compiled and linked
        shell: bash
        run: |
          echo "== Phase 3 real libweston path verification =="
          echo "The bridge library must be linked against the cross-built libweston (libweston-<major>.so)."
          if grep -q 'libweston found at' build-log.txt; then
            echo "PASS: native CMake detected the real libweston install (LINUXDROID_HAS_LIBWESTON)."
          else
            echo "FAIL: native CMake did NOT detect libweston; the fallback path was used."
            exit 1
          fi
          # Confirm the linuxdroid_backend.c + weston_host.cpp compilation and
          # that libweston is a link input (libweston-16 / libweston-17 ...).
          if grep -q 'libweston-1' build-log.txt; then
            echo "PASS: libweston-<major> referenced (compiled/linked)."
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log.txt
          if-no-files-found: warn
          retention-days: 7
          path: build-log.txt

      - name: Generate APK checksum
        run: |
          sha256sum app/build/outputs/apk/release/*.apk \
            > app/build/outputs/apk/release/SHA256SUMS

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: linuxdroid-release-apk
          if-no-files-found: error
          retention-days: 1
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS
